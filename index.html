<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-light-64.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-dark-64.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevNest Todo</title>
    <script>
      // ใส่ class ธีมก่อน React โหลด หน้าจะได้ไม่กะพริบ (key ต้องตรงกับ ThemeProvider.jsx)
      (function () {
        try {
          var theme = localStorage.getItem('vite-ui-theme') || 'system';
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          console.warn('Could not restore theme', error);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
